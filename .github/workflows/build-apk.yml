name: Build Joyit APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Reduce App Icon Logo Size
        shell: bash
        run: |
          set -e

          find app/src/main/res -type f \
            -name "ic_launcher_foreground.png" \
            -print0 |
          while IFS= read -r -d '' file; do
            echo "Processing: $file"

            magick "$file" \
              -resize 70% \
              -gravity center \
              -background none \
              -extent "$(magick identify -format '%wx%h' "$file")" \
              "$file.tmp.png"

            mv "$file.tmp.png" "$file"
          done

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: joyit-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
