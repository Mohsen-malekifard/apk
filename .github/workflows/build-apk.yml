name: Build Joyit APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reduce App Icon Logo Size
        shell: bash
        run: |
          set -e

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          files = list(
              Path("app/src/main/res").rglob("ic_launcher_foreground.png")
          )

          if not files:
              raise SystemExit(
                  "ERROR: ic_launcher_foreground.png was not found!"
              )

          for file in files:
              print(f"Processing: {file}")

              with Image.open(file) as source:
                  image = source.convert("RGBA")

              width, height = image.size
              scale = 0.70

              new_width = round(width * scale)
              new_height = round(height * scale)

              logo = image.resize(
                  (new_width, new_height),
                  Image.Resampling.LANCZOS
              )

              result = Image.new(
                  "RGBA",
                  (width, height),
                  (0, 0, 0, 0)
              )

              x = (width - new_width) // 2
              y = (height - new_height) // 2

              result.alpha_composite(logo, (x, y))
              result.save(file, format="PNG")

              print(
                  f"SUCCESS: {file} | "
                  f"Original: {width}x{height} | "
                  f"Logo: {new_width}x{new_height}"
              )
          PY

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -e

          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/joyit-release.jks"

          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/joyit-release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || \
             [ -z "$ANDROID_KEY_ALIAS" ] || \
             [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "ERROR: One or more Android signing secrets are missing."
            exit 1
          fi

          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify Release APK Signature
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: joyit-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Clean Up Release Keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/joyit-release.jks"
